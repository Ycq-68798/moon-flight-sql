name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install test dependency
        run: python -m pip install 'pyarrow==19.0.1'
      - name: Check and run unit tests
        run: |
          moon version --all
          moon update
          moon check --target native
          moon test --target native
      - name: Exercise Flight SQL queries, XDBC metadata and schema decoding against PyArrow
        shell: bash
        run: |
          start_server() {
            python tests/server.py --port 8815 "$@" > server.log 2>&1 &
            server_pid=$!
            python - <<'PY'
          import socket
          import time
          for _ in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 8815), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Flight test server did not start')
          PY
          }
          stop_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          stop_ipv6() {
            if [ -n "${ipv6_pid:-}" ]; then
              kill "$ipv6_pid" 2>/dev/null || true
              wait "$ipv6_pid" 2>/dev/null || true
              ipv6_pid=""
            fi
          }
          trap 'stop_ipv6; stop_server' EXIT
          python tests/server.py --port 0 --token demo-token --self-test
          start_server
          moon run cmd/main --target native
          moon run cmd/catalogs --target native
          moon run cmd/discovery --target native
          moon run cmd/address --target native
          if python -c 'import socket; s=socket.socket(socket.AF_INET6); s.bind(("::1", 0)); s.close()' 2>/dev/null; then
            python tests/server.py --host ::1 --port 8816 > server-ipv6.log 2>&1 &
            ipv6_pid=$!
            python - <<'PY'
          import socket
          import time
          for _ in range(100):
              try:
                  with socket.create_connection(('::1', 8816), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('IPv6 Flight test server did not start')
          PY
            moon run cmd/ipv6 --target native
            stop_ipv6
          else
            echo 'IPv6 loopback unavailable; skipping IPv6 integration test'
          fi
          stop_server
          start_server --bad-catalog-schema
          moon run cmd/catalogs_bad --target native
          stop_server
          start_server --empty-catalog
          moon run cmd/catalogs_empty --target native
          stop_server
          start_server --catalog-no-endpoints
          moon run cmd/catalogs_empty --target native
          stop_server
          start_server --catalog-no-endpoints --bad-catalog-schema
          moon run cmd/catalogs_bad --target native
          stop_server
          start_server --schema-mismatch
          moon run cmd/schema_mismatch --target native
          stop_server
          start_server --metadata-no-endpoints
          moon run cmd/discovery_empty --target native
          stop_server
          start_server --metadata-no-endpoints --bad-metadata-schema
          moon run cmd/discovery_bad --target native
          stop_server
          start_server --metadata-no-endpoints --bad-xdbc-child
          moon run cmd/xdbc_bad_child --target native
          stop_server
          start_server --metadata-schema-mismatch
          moon run cmd/discovery_mismatch --target native
          stop_server
          start_server --many
          moon run cmd/limit --target native
          stop_server
          start_server --multi
          moon run cmd/multi --target native
          moon run cmd/discovery_multi --target native
          stop_server
          start_server --token demo-token
          moon run cmd/auth --target native
          stop_server
          start_server --unknown-count
          moon run cmd/unknown --target native
          stop_server
          start_server --medium --unknown-count
          moon run cmd/medium --target native
          stop_server
          start_server --large --unknown-count
          moon run cmd/large --target native
          stop_server
          start_server --large
          moon run cmd/large --target native
          stop_server
          start_server --delay 1
          moon run cmd/timeout --target native
      - name: Reject malformed and oversized response headers
        shell: bash
        run: |
          python tests/header_attack.py --mode repeat --port 8817 > header-repeat.log 2>&1 &
          repeat_pid=$!
          python tests/header_attack.py --mode budget --port 8818 > header-budget.log 2>&1 &
          budget_pid=$!
          python tests/header_attack.py --mode invalid-grpc --port 8819 > header-invalid.log 2>&1 &
          invalid_pid=$!
          python tests/header_attack.py --mode http-failure --port 8820 > header-http.log 2>&1 &
          http_pid=$!
          python tests/header_attack.py --mode missing-grpc --port 8821 > header-missing.log 2>&1 &
          missing_pid=$!
          python tests/header_attack.py --mode status-overwrite --port 8822 > header-overwrite.log 2>&1 &
          overwrite_pid=$!
          trap 'kill "$repeat_pid" "$budget_pid" "$invalid_pid" "$http_pid" "$missing_pid" "$overwrite_pid" 2>/dev/null || true' EXIT
          for i in {1..100}; do
            if grep -q ready header-repeat.log && grep -q ready header-budget.log && grep -q ready header-invalid.log && grep -q ready header-http.log && grep -q ready header-missing.log && grep -q ready header-overwrite.log; then break; fi
            sleep 0.1
          done
          grep -q ready header-repeat.log
          grep -q ready header-budget.log
          grep -q ready header-invalid.log
          grep -q ready header-http.log
          grep -q ready header-missing.log
          grep -q ready header-overwrite.log
          moon run cmd/header_guard --target native
          wait "$repeat_pid"
          wait "$budget_pid"
          wait "$invalid_pid"
          wait "$http_pid"
          wait "$missing_pid"
          wait "$overwrite_pid"
